name: Validate staged release assets
on:
  push:
    branches: [main]
    paths: ['cli/**', 'releases/**', 'scripts/**']
  pull_request:
    paths: ['cli/**', 'releases/**', 'scripts/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Exercise release validation failures in isolated fixtures
        run: node --test scripts/release.test.mjs scripts/publish-release.test.mjs
      - name: Verify staged assets without modifying a published release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < cli/VERSION)"
          node scripts/verify-release.mjs "v${version}"
          cmp cli/cli.cjs "releases/v${version}/cli.cjs"
          cmp cli/paw-prints.cjs "releases/v${version}/paw-prints.cjs"
