name: Build and release Windows installer

# Two ways a release gets published here:
#
# 1. Tag push (v*): the job "publish-prebuilt" takes the installer already committed under
#    releases/<tag>/ (built locally with `npm run tauri:build`, hash in the .sha256 file) and
#    creates the GitHub Release with notes from CHANGELOG.md. No secrets needed.
#    Also attaches cli/cli.cjs + cli/paw-prints.cjs + cli/VERSION so the web desk
#    Windows (.ps1) / macOS-Linux (.sh) setup scripts stay in step with this installer.
#
# 2. Manual run (workflow_dispatch): the job "windows-installer" builds the desk from the
#    Dev-Autographs repo on a Windows runner and publishes the result. Dev-Autographs is private,
#    so this needs a repo secret INSTALLER_RELEASE_TOKEN (fine-grained PAT with Contents: read
#    on Dev-Autographs and Contents: write on this repo).
#
# The hosted registry URL is NOT configured here. It lives in Dev-Autographs/registry.json and
# is baked into the desk, CLI and Tauri shell by `npm run registry:sync` (part of `npm run build`).

on:
  workflow_dispatch:
    inputs:
      code_ink_ref:
        description: "Dev-Autographs git ref (branch/tag/SHA)"
        required: true
        default: "main"
      version:
        description: "Release tag (e.g. v0.2.0)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: installer-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-prebuilt:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Exercise release validation failures in isolated fixtures
        run: node --test scripts/release.test.mjs scripts/publish-release.test.mjs

      - name: Locate committed installer for this tag
        id: files
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          dir="releases/${tag}"
          node scripts/verify-release.mjs "$tag"
          node scripts/publish-release.mjs check "$tag"
          exe="${dir}/Dev-Autographs_${ver}_x64-setup.exe"
          if [ ! -f "$exe" ]; then
            echo "No installer committed under ${dir}. Run the workflow manually to build one." >&2
            exit 1
          fi
          if [ ! -f cli/cli.cjs ] || [ ! -f cli/paw-prints.cjs ]; then
            echo "cli/cli.cjs and cli/paw-prints.cjs are required so web desk setup scripts stay current." >&2
            exit 1
          fi
          cmp cli/cli.cjs "$dir/cli.cjs"
          cmp cli/paw-prints.cjs "$dir/paw-prints.cjs"
          test "$(tr -d '\r\n' < cli/VERSION)" = "$ver"
          echo "exe=${exe}" >> "$GITHUB_OUTPUT"
          echo "sha=${exe}.sha256" >> "$GITHUB_OUTPUT"
          echo "hash=$(cut -d' ' -f1 "${exe}.sha256")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release body from CHANGELOG
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then echo "See CHANGELOG.md" > release-body.md; fi
          printf '\n\n**SHA-256** `%s`  \n_Published %s UTC from the installer committed in this repo._\n' \
            "${{ steps.files.outputs.hash }}" "$(date -u +%Y-%m-%d)" >> release-body.md
          printf '\nWeb desk setup (.ps1 / .sh) installs **cli.cjs** from this release (same build).\n' >> release-body.md

      - name: Create a new release with verified assets (never update existing releases)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs publish "$GITHUB_REF_NAME" release-body.md

  windows-installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Dev-Autographs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Creal212/Dev-Autographs
          ref: ${{ github.event.inputs.code_ink_ref }}
          path: dev-autographs
          token: ${{ secrets.INSTALLER_RELEASE_TOKEN }}

      - name: Checkout installer repo (release notes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: installer

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dev-autographs/package-lock.json

      - name: Exercise release validation and publication failures
        run: node --test installer/scripts/release.test.mjs installer/scripts/publish-release.test.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        working-directory: dev-autographs
        run: npm ci

      - name: Require an unused version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.INSTALLER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid version tag' }
          node installer/scripts/publish-release.mjs check $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build monorepo (runs registry:sync first)
        working-directory: dev-autographs
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Tauri NSIS installer
        working-directory: dev-autographs
        run: npm run tauri:build

      - name: Find installer artifact, hash it, stage CLI for web desk setups
        id: artifact
        working-directory: dev-autographs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          $exe = Get-Item -LiteralPath "apps/desktop/src-tauri/target/release/bundle/nsis/Dev Autographs_${ver}_x64-setup.exe"
          if (-not $exe) { throw "NSIS installer not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "$hash  $($exe.Name)" | Out-File -FilePath "$($exe.FullName).sha256" -Encoding ascii
          $ver = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/cli-out" | Out-Null
          Copy-Item "packages/cli/bin/cli.cjs" "$env:GITHUB_WORKSPACE/cli-out/cli.cjs" -Force
          Copy-Item "packages/cli/bin/paw-prints.cjs" "$env:GITHUB_WORKSPACE/cli-out/paw-prints.cjs" -Force
          Set-Content -Path "$env:GITHUB_WORKSPACE/cli-out/VERSION" -Value $ver -NoNewline
          node ../installer/scripts/prepare-release.mjs . $exe.FullName $ver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "releaseDir=$env:GITHUB_WORKSPACE/installer/releases/$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Release body from CHANGELOG
        id: notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $md = Get-Content installer/CHANGELOG.md -Raw
          $m = [regex]::Match($md, "(?s)## \[$([regex]::Escape($tag.TrimStart('v')))\][^\n]*\n(.*?)(?=\n## \[|\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $body += "`n`n**SHA-256** `${{ steps.artifact.outputs.sha256 }}`  `n_Built $(Get-Date -Format 'yyyy-MM-dd') UTC by GitHub Actions._"
          $body += "`n`nWeb desk setup (.ps1 / .sh) installs **cli.cjs** from this release (same build)."
          Set-Content -Path release-body.md -Value $body

      - name: Create a new release with verified assets (never update existing releases)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.INSTALLER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node installer/scripts/publish-release.mjs publish $env:RELEASE_TAG release-body.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
